<div class="wrap">
    <div class="dash-header">
        <div class="brand">
            <div class="mark">C</div>
            <div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <h1 id="pgTitle">Cheques in Portfolio</h1>
                    <div class="period-badge" id="periodBadge">Loading</div>
                </div>
                <div class="subtitle" id="pgSub"></div>
            </div>
        </div>
        <div class="header-actions">
            <div class="actions-row">
                <span id="exportBox"></span>
            </div>
            <div class="asof-line" id="asOfLine"></div>
        </div>
    </div>

    <div class="cq-tabs" id="cqTabs">
        <button type="button" data-t="P" class="on">Cheques in portfolio</button>
        <button type="button" data-t="M">Cheque movement</button>
    </div>

    <div id="stPTitle"></div>

    <div id="tabP">
        <div class="sp-bar">
            <div class="sk-filters ic-filters po-f">
                <div class="po-row">
                    <div class="filter-group">
                        <label title="Cheques received up to this date and not deposited or returned by it">As of date</label>
                        <div class="po-per">
                            <div class="ic-period"><input type="date" id="fAsOf" title="The portfolio as it was at the end of this day"></div>
                            <button type="button" class="ic-run" id="runBtn" title="Load the portfolio for the date on the left">&#9654; Run</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Portfolio</label>
                        <div class="sk-chips" id="pfChips"></div>
                    </div>
                    <div class="filter-group">
                        <label title="Days from the day the cheque was received to the as of date">Days in portfolio</label>
                        <div class="sk-chips" id="ageChips"></div>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button type="button" class="po-reset" id="resetBtn" title="Back to today, all portfolios">&#8635; Reset</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="sp-kpis" id="stKpi" style="display:none"></div>
        <div id="pfBody"><div class="panel"><div class="dr-none">Loading...</div></div></div>
    </div>

    <div id="tabM" style="display:none">
        <div class="sp-bar">
            <div class="sk-filters ic-filters po-f">
                <div class="po-row">
                    <div class="filter-group">
                        <label title="Type the first digits of the cheque number or of its amount, then pick the cheque from the list">Cheque - number or amount</label>
                        <div class="search-select cq-box"><input type="text" id="cqIn" placeholder="Type a cheque no. or an amount..." autocomplete="off"><div class="cq-sg" id="cqSg"></div></div>
                    </div>
                    <div class="filter-group">
                        <label title="Movements of the cheque dated inside the period">Period</label>
                        <div class="po-per">
                            <div class="ic-period">
                                <input type="date" id="fFrom" title="First movement date">
                                <span class="ic-sep">&#8211;</span>
                                <input type="date" id="fTo" title="Last movement date">
                            </div>
                            <button type="button" class="ic-run" id="runBtnM" title="Load the cheque again for the dates on the left">&#9654; Run</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Quick range</label>
                        <div class="sk-chips po-quick" id="quickChips"></div>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button type="button" class="po-reset" id="resetBtnM" title="Clear the cheque and go back to this year">&#8635; Reset</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="panel po-lv" id="mvBody"></div>
    </div>

    <div class="panel po-lv" id="lvPanel" style="display:none"></div>
</div>
