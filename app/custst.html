<div class="t-Body" id="top"><div class="t-Body-main"><div class="t-Body-content">
<!-- CUSTST.HTML - Customer Statement page (Static Content region, Seq 20): the markup (source CUSTST.BODY.HTML) + the print rules in a <style> at the end (source CUSTST.PRINT.CSS), joined by CUSTST_COMPACT.py - 03/10/2026 -->
<div class="wrap">
    <div class="dash-header">
        <div class="brand">
            <div class="mark">C</div>
            <div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <h1>Customer Statement</h1>
                    <div class="period-badge" id="periodBadge">Loading</div>
                </div>
                <div class="subtitle">Account statement from the customer ledger: invoices, returns, receipts and adjustments - by supervisor, salesman, then customer</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="actions-row">
                <span id="exportBox"></span>
            </div>
            <div class="asof-line" id="asOfLine"></div>
        </div>
    </div>

    <div class="sp-bar">
        <div class="sk-filters ic-filters po-f">
            <div class="po-row">
                <div class="filter-group">
                    <label title="Ledger movements dated inside the period; everything before it is the opening balance">Period</label>
                    <div class="po-per">
                        <div class="ic-period">
                            <input type="date" id="fFrom" title="First movement date">
                            <span class="ic-sep">&#8211;</span>
                            <input type="date" id="fTo" title="Last movement date">
                        </div>
                        <button type="button" class="ic-run" id="runBtn" title="Load the report for the dates on the left">&#9654; Run</button>
                    </div>
                </div>
                <div class="filter-group">
                    <label title="Periods ending today">Quick range</label>
                    <div class="sk-chips po-quick" id="quickChips"></div>
                </div>
                <div class="filter-group po-grow">
                    <label title="Opens the statement of the customer chosen from the list">Customer</label>
                    <div class="search-select">
                        <input type="text" id="fSup" placeholder="Type part of the customer name or code, then choose..." autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="po-line2">
                <div class="filter-group">
                    <label title="With overdue = invoices past their payment terms; Not posted = sales documents not posted to the customer ledger">Show customers</label>
                    <div class="sk-chips" id="showChips"></div>
                </div>
                <span class="po-div"></span>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button type="button" class="po-reset" id="resetBtn" title="Reset the filters">&#8635; Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div id="stPTitle"></div>
    <div class="sp-kpis" id="stKpi" style="display:none"></div>

    <div class="panel" id="printTablePanel" style="margin-bottom:16px">
        <div class="table-header-row">
            <div><h3><span class="dot"></span> Supervisors - salesmen, current customers, movement and balance</h3></div>
            <div class="table-tools">
                <span class="mv-loading" id="tableNote">Loading...</span>
            </div>
        </div>
        <div class="table-scroll">
            <table id="stTable"></table>
        </div>
    </div>
    <div class="panel po-lv" id="lvPanel" style="display:none"></div>
</div>
