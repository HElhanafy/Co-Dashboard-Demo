<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Expiry - Co. Dashboard</title>
<script src="../theme/theme.js"></script>
<link rel="stylesheet" href="../theme/THEME.css">
<link rel="stylesheet" href="../shim/base.css">
<link rel="stylesheet" href="css/p0_jm_tokens.compact.css">
<link rel="stylesheet" href="css/p0_sidebar.compact.css">
<link rel="stylesheet" href="css/p0_sales.doc.compact.css">
<link rel="stylesheet" href="css/expiry_expiry.compact.css">
<link rel="stylesheet" href="../shim/responsive.css">
<script src="../data/load.js"></script>
<script src="../shim/nav.js"></script>
<script src="../shim/apex.js"></script>
<script src="../shim/srv_core.js"></script>
<script src="../shim/srv_shared.js"></script>
<script src="../shim/srv_expiry.js"></script>
<script src="js/expiry_expiry.xlsx.compact.js"></script>
</head>
<body data-alias="EXPIRY">
<script src="../shim/shell.js"></script>
<script src="../shim/i18n.js"></script>
<div class="t-Body" id="top"><div class="t-Body-main"><div class="t-Body-content">
<div class="wrap">
    <!-- Header -->
    <div class="dash-header">
        <div class="brand">
            <div class="mark">E</div>
            <div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <h1>Stock Expiry</h1>
                    <div class="period-badge" id="periodBadge">Loading...</div>
                </div>
                <div class="subtitle">Quantity on hand by item and lot that expires within the selected horizon, in the item default unit, as of the selected date</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="actions-row">
                <!-- Export (Excel . PDF): the shared control window.jmExport drawn by EXPIRY.JS (page 0 regions, SHARED_UI = Y); without it the two old buttons are drawn - 20/10/2026 -->
                <span id="exportBox"></span>
            </div>
            <div class="asof-line" id="asOfLine"></div>
        </div>
    </div>

    <!-- Filters: 20/10/2026 layout as STOCK (user decision): the card spans the table width; the main block holds row 1 = date . class . warehouse type as pills
         (the hidden select keeps the value), row 2 = the item search, then the expiry slice, branch and warehouse chip rows; the side box beside it holds Reset -->
    <div class="sk-filters">
        <div class="sk-top">
            <div class="sk-main">
                <div class="sk-bar">
                    <div class="filter-group sk-date">
                        <label>As of Date (inclusive)</label>
                        <div class="sk-step">
                            <input type="date" id="fDate" title="Any date: a future date measures expiry from that day on today's stock">
                        </div>
                    </div>
                    <div class="filter-group sk-class">
                        <label>Item Class</label>
                        <div class="cls-pick" id="clsPick">
                            <button type="button" class="cls-btn" id="fClassBtn" title="Choose a class"><span id="fClassLbl">All Classes</span><i>&#9662;</i></button>
                            <select id="fClass" class="cls-sel"><option value="">All Classes</option></select>
                            <div class="ss-menu" id="fClassMenu"><input type="text" id="fClassQ" placeholder="Type to filter the classes..." autocomplete="off"><div id="fClassList"></div></div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Warehouse Type</label>
                        <select id="fType" style="display:none"></select>
                        <div class="tp" id="typeChips"></div>
                    </div>
                </div>
                <div class="sk-row2">
                    <div class="filter-group sk-grow">
                        <label>Item</label>
                        <div class="search-select">
                            <input type="text" id="fItem" placeholder="Type a code or part of the name - pick from the list or keep typing to filter..." autocomplete="off">
                            <button type="button" class="clear-btn" id="fItemClr" style="display:none">&times;</button>
                            <div class="ss-menu" id="itemMenu" style="display:none"></div>
                        </div>
                    </div>
                </div>
                <div class="sk-line">
                    <span class="sk-lbl" title="Months from the as-of date to the expiry date; click to show or hide">Expires in</span>
                    <div class="sk-chips" id="sliceChips"></div>
                </div>
                <div class="sk-line">
                    <span class="sk-lbl" title="Whole company or one branch">Branch</span>
                    <div class="sk-chips" id="branchChips"></div>
                </div>
                <div class="sk-line sk-sub" id="storeGroup" style="display:none">
                    <span class="sk-lbl" title="All warehouses of the branch, or one">Warehouse</span>
                    <div class="sk-chips" id="storeChips"></div>
                </div>
            </div>
            <div class="sk-side">
                <label>Filters</label>
                <div class="sk-side-note">Slices, branch and warehouse chips narrow the table</div>
                <button type="button" class="sk-reset" id="resetBtn" title="Clear all filters">&#8635; Reset</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="panel" id="printTablePanel" style="margin-bottom:16px">
        <div class="table-header-row">
            <div>
                <h3><span class="dot"></span> <span id="tableTitleText">Expiring Stock - Company</span></h3>
            </div>
            <div class="table-tools">
                <button type="button" class="btn-back" id="backBtn" style="display:none">&#8592; Company</button>
                <button type="button" class="btn-view" id="toggleAllBtn" title="Collapse or expand all class groups">Collapse all</button>
            </div>
        </div>
        <div class="print-filters" id="printFilters"></div>
        <div class="table-scroll">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="panel-note" id="tableNote"></div>
    </div>
</div>

</div></div></div>
<footer class="t-Footer"><div class="t-Footer-top"><a href="#top" class="t-Footer-topButton" title="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><polyline points="18 15 12 9 6 15"></polyline></svg></a></div></footer>
<script>DEMO_RENDER("expiry")</script>
<script src="js/p0_sidebar.compact.js"></script>
<script src="js/p0_sales.doc.compact.js"></script>
<script src="js/p0_gl.entry.compact.js"></script>
<script src="js/expiry_expiry.compact.js"></script>
<script src="../shim/responsive.js"></script>
</body></html>
