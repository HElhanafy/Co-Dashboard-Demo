<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO Arrivals - Co. Dashboard</title>
<script src="../theme/theme.js"></script>
<link rel="stylesheet" href="../theme/THEME.css">
<link rel="stylesheet" href="../shim/base.css">
<link rel="stylesheet" href="css/p0_jm_tokens.compact.css">
<link rel="stylesheet" href="css/p0_sidebar.compact.css">
<link rel="stylesheet" href="css/p0_sales.doc.compact.css">
<link rel="stylesheet" href="css/poarr_poarr.compact.css">
<link rel="stylesheet" href="../shim/responsive.css">
<script src="../data/load.js"></script>
<script src="../shim/nav.js"></script>
<script src="../shim/apex.js"></script>
<script src="../shim/srv_core.js"></script>
<script src="../shim/srv_shared.js"></script>
<script src="../shim/srv_poarr.js"></script>
<script src="js/poarr_poarr.fg.compact.js"></script>
</head>
<body data-alias="POARR">
<script src="../shim/shell.js"></script>
<script src="../shim/i18n.js"></script>
<div class="t-Body" id="top"><div class="t-Body-main"><div class="t-Body-content">
<!-- POARR.HTML - PO Arrivals page (Static Content region, Seq 20). markup only - the rules live in POARR.CSS - 23/09/2026 -->
<div class="wrap">
    <div class="dash-header">
        <div class="brand">
            <div class="mark">P</div>
            <div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <h1>PO Arrivals</h1>
                    <div class="period-badge" id="periodBadge">Loading</div>
                </div>
                <div class="subtitle">Ordered shipments by item and month of arrival, against period sales and stock - quantities in the default unit</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="actions-row">
                <!-- user 20/10/2026: no dashboard print here, so Export (Excel . PDF of the table) stays in the header (item 35 rule); the shared control window.jmExport is drawn by POARR.JS (SHARED_UI = Y) -->
                <span id="exportBox"></span>
            </div>
            <div class="asof-line" id="asOfLine"></div>
        </div>
    </div>

    <div class="po-bar">
        <div class="po-left">
        <div class="sk-filters ic-filters po-f">
            <div class="po-row">
                <div class="filter-group">
                    <label>Sales period</label>
                    <div class="po-per">
                        <div class="ic-period">
                            <input type="date" id="fFrom" title="Start of the sales period">
                            <span class="ic-sep">&#8211;</span>
                            <input type="date" id="fTo" title="End of the sales period">
                        </div>
                        <button type="button" class="ic-run" id="runBtn" title="Load the report for the dates on the left">&#9654; Run</button>
                    </div>
                </div>
                <div class="filter-group po-grow">
                    <label>Item</label>
                    <div class="search-select">
                        <input type="text" id="fItem" placeholder="Filter by item code or name..." autocomplete="off">
                    </div>
                </div>
                <div class="filter-group po-cls">
                    <label>Item class</label>
                    <div class="cls-pick" id="clsPick">
                        <button type="button" class="cls-btn" id="fClassBtn" title="Choose a class"><span id="fClassLbl">All classes</span><i>&#9662;</i></button>
                        <select id="fClass" class="cls-sel"><option value="">All classes</option></select>
                        <div class="ss-menu" id="fClassMenu"><input type="text" id="fClassQ" placeholder="Type to filter the classes..." autocomplete="off"><div id="fClassList"></div></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="sk-filters ic-filters po-f">
            <div class="po-line2">
                <div class="filter-group">
                    <label title="Sales period ending today">Quick range</label>
                    <div class="sk-chips po-quick" id="quickChips"></div>
                </div>
                <span class="po-div"></span>
                <div class="filter-group">
                    <label title="Medical = classes below 2100, Commercial = classes from 2001 (as the MOVE report). Sutures = class 1001">Items</label>
                    <div class="sk-chips" id="dpChips"></div>
                </div>
            </div>
            <div class="po-line2 po-line3">
                <div class="filter-group">
                    <label title="Narrow the list">Show</label>
                    <div class="sk-chips" id="showChips"></div>
                </div>
            </div>
        </div>
        </div>
        <div class="po-f po-side">
            <div class="filter-group">
                <label title="Company = every order, as the system report. Branch = the orders going to one branch, with its sales and its stock">View</label>
                <div class="po-seg" id="viewSeg"></div>
            </div>
            <div class="filter-group" id="brGroup" style="display:none">
                <label title="The branch the shipments go to - the small figure is the number of items on their way to it">Branch</label>
                <div class="sk-chips po-brs" id="brChips"></div>
            </div>
            <button type="button" class="po-reset" id="resetBtn" title="Reset the filters">&#8635; Reset</button>
        </div>
    </div>

    <div class="po-kpis" id="poKpi" style="display:none"></div>

    <div class="panel" id="printTablePanel" style="margin-bottom:16px">
        <div class="table-header-row">
            <div><h3><span class="dot"></span> <span id="tableTitle">Ordered shipments and arrival months</span></h3><div class="po-printed" id="poPrinted"></div></div>
            <div class="table-tools">
                <span class="mv-loading" id="tableNote">Loading...</span>
                <button type="button" class="btn-view" id="toggleAllBtn" title="Collapse or expand all class groups">Collapse all</button>
            </div>
        </div>
        <div class="table-scroll">
            <table id="poTable"></table>
        </div>
    </div>
    <div class="panel po-lv" id="ordPanel" style="display:none"></div>
    <div class="panel po-lv" id="poPanel" style="display:none"></div>
</div>

</div></div></div>
<footer class="t-Footer"><div class="t-Footer-top"><a href="#top" class="t-Footer-topButton" title="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><polyline points="18 15 12 9 6 15"></polyline></svg></a></div></footer>
<script src="js/p0_sidebar.compact.js"></script>
<script src="js/p0_sales.doc.compact.js"></script>
<script src="js/p0_gl.entry.compact.js"></script>
<script src="js/poarr_poarr.compact.js"></script>
<script src="../shim/responsive.js"></script>
</body></html>
