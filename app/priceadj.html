<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Adjustment - Co. Dashboard</title>
<script src="../theme/theme.js"></script>
<link rel="stylesheet" href="../theme/THEME.css">
<link rel="stylesheet" href="../shim/base.css">
<link rel="stylesheet" href="css/p0_jm_tokens.compact.css">
<link rel="stylesheet" href="css/p0_sidebar.compact.css">
<link rel="stylesheet" href="css/p0_sales.doc.compact.css">
<link rel="stylesheet" href="css/priceadj_priceadj.compact.css">
<link rel="stylesheet" href="../shim/responsive.css">
<script src="../data/load.js"></script>
<script src="../shim/nav.js"></script>
<script src="../shim/apex.js"></script>
<script src="../shim/srv_core.js"></script>
<script src="../shim/srv_shared.js"></script>
<script src="../shim/srv_priceadj.js"></script>
<script src="js/priceadj_priceadj.fg.compact.js"></script>
</head>
<body data-alias="PRICEADJ">
<script src="../shim/shell.js"></script>
<script src="../shim/i18n.js"></script>
<div class="t-Body" id="top"><div class="t-Body-main"><div class="t-Body-content">
<div class="wrap">
    <div class="dash-header">
        <div class="brand">
            <div class="mark">P</div>
            <div>
                <div style="display:flex; align-items:center; gap: 12px; flex-wrap: wrap;">
                    <h1>Price Adjustment</h1>
                    <div class="period-badge" id="periodBadge">Choose a class</div>
                </div>
                <div class="subtitle">Sales prices by unit: draft, review, approve - every unit of the item follows its factor</div>
            </div>
        </div>
        <div class="header-actions">
          <div class="actions-row">
            <a href="home.html" class="btn-reset pa-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Home
            </a>
          </div>
          <div class="asof-line fresh" id="asOfLine">Prices and cost live from Co.</div>
        </div>
    </div>

    <div class="pa-card pa-strip" id="paFilters">
        <div class="pa-filters">
            <div class="filter-group"><label>Class</label>
                <div class="pa-cls" id="clsBox">
                    <button type="button" class="cls-btn" id="clsBtn"><span id="clsLbl">Choose a class</span><i>&#9662;</i></button>
                    <div class="ss-menu" id="clsMenu"><input type="text" id="clsInput" placeholder="Type to filter the classes..." autocomplete="off"><div id="clsList"></div></div>
                </div>
            </div>
            <div class="filter-group"><label>Item</label><input type="text" class="pa-box pa-item" id="itemInput" placeholder="Code or name in the class" autocomplete="off"></div>
            <div class="filter-group"><label>View</label>
                <div class="pa-view" id="viewBox"><button type="button" class="vbtn on" data-v="EDIT">Edit prices</button><button type="button" class="vbtn" data-v="LOG">Changes log</button></div>
            </div>
            <div class="filter-group filter-reset"><label>&nbsp;</label><button type="button" class="btn-reset" id="resetBtn">Reset</button></div>
        </div>
    </div>

    <div class="pa-card" id="batchCard">
        <div class="pa-batch">
            <span class="pa-tag">Price change</span><span class="pa-no" id="bNo">new</span><span class="pa-st draft" id="bSt">DRAFT</span>
            <span class="pa-meta" id="bMeta"></span>
            <span class="pa-sp"></span>
            <button type="button" class="pa-btn" id="bulkBtn">Bulk change</button>
            <button type="button" class="pa-btn" id="pasteBtn">Paste from Excel</button>
            <button type="button" class="pa-btn" id="saveBtn">Save draft</button>
            <button type="button" class="pa-btn act fill" id="approveBtn">Review &amp; approve</button>
        </div>
    </div>

    <div class="panel" id="printTablePanel">
        <div class="table-header-row">
            <div>
                <h3><span class="dot"></span> <span id="tableTitleText">Price adjustment</span></h3>
                <div class="panel-sub" id="tableSub"></div>
            </div>
            <div class="table-tools">
                <button type="button" class="btn-back" id="backBtn" style="display:none">&#8592; Back</button>
                <span class="level-tabs" id="showTabs"></span>
                <button type="button" class="pa-btn quiet" id="clearBtn">Clear</button>
                <span id="actBox"></span>
                <span id="exportBox"></span>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="tableLoader" class="table-loader" style="display:none;">Loading...</div>
    </div>
</div>
<div class="pa-mask" id="paMask"><div class="pa-dlg" id="paDlg"></div></div>

</div></div></div>
<footer class="t-Footer"><div class="t-Footer-top"><a href="#top" class="t-Footer-topButton" title="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><polyline points="18 15 12 9 6 15"></polyline></svg></a></div></footer>
<script>DEMO_RENDER("priceadj")</script>
<script src="js/p0_sidebar.compact.js"></script>
<script src="js/p0_sales.doc.compact.js"></script>
<script src="js/p0_gl.entry.compact.js"></script>
<script src="js/priceadj_priceadj.compact.js"></script>
<script src="../shim/responsive.js"></script>
</body></html>
