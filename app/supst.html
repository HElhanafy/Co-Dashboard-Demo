<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier Statement - Co. Dashboard</title>
<script src="../theme/theme.js"></script>
<link rel="stylesheet" href="../theme/THEME.css">
<link rel="stylesheet" href="../shim/base.css">
<link rel="stylesheet" href="css/p0_jm_tokens.compact.css">
<link rel="stylesheet" href="css/p0_sidebar.compact.css">
<link rel="stylesheet" href="css/p0_sales.doc.compact.css">
<link rel="stylesheet" href="css/supst_supst.compact.css">
<script src="../data/load.js"></script>
<script src="../shim/nav.js"></script>
<script src="../shim/apex.js"></script>
<script src="../shim/srv_core.js"></script>
<script src="../shim/srv_shared.js"></script>
<script src="../shim/srv_supst.js"></script>
<script src="../shim/srv_poarr.js"></script>
<script src="js/supst_supst.fg.compact.js"></script>
</head>
<body data-alias="SUPST">
<script src="../shim/shell.js"></script>
<script src="../shim/i18n.js"></script>
<div class="t-Body" id="top"><div class="t-Body-main"><div class="t-Body-content">

<div class="wrap">
    <div class="dash-header">
        <div class="brand">
            <div class="mark">S</div>
            <div>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                    <h1>Supplier Statement</h1>
                    <div class="period-badge" id="periodBadge">Loading</div>
                </div>
                <div class="subtitle">Account statement from the vendor ledger: invoices, expenses, payments and adjustments - purchase orders have no accounting effect and are not included</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="actions-row">
                <span id="exportBox"></span>
            </div>
            <div class="asof-line" id="asOfLine"></div>
        </div>
    </div>

    <div class="sp-bar">
        <div class="sk-filters ic-filters po-f">
            <div class="po-row">
                <div class="filter-group">
                    <label title="Ledger movements dated inside the period; everything before it is the opening balance">Period</label>
                    <div class="po-per">
                        <div class="ic-period">
                            <input type="date" id="fFrom" title="First movement date">
                            <span class="ic-sep">&#8211;</span>
                            <input type="date" id="fTo" title="Last movement date">
                        </div>
                        <button type="button" class="ic-run" id="runBtn" title="Load the report for the dates on the left">&#9654; Run</button>
                    </div>
                </div>
                <div class="filter-group">
                    <label title="Periods ending today">Quick range</label>
                    <div class="sk-chips po-quick" id="quickChips"></div>
                </div>
                <div class="filter-group po-grow">
                    <label>Supplier</label>
                    <div class="search-select">
                        <input type="text" id="fSup" placeholder="Filter by supplier name or code..." autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="po-line2">
                <div class="filter-group">
                    <label title="Needs attention = document numbers not entered, movements not posted to the general ledger, receipts not yet in the supplier ledger">Show</label>
                    <div class="sk-chips" id="showChips"></div>
                </div>
                <!-- Currency and Reset at the right end, as SUPAY (user 20/10/2026) -->
                <div class="filter-group sp-right">
                    <label title="Every figure is in SAR; USD at the fixed peg 3.75 (the journal entry level stays in SAR)">Currency</label>
                    <div class="sk-chips" id="curChips"></div>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button type="button" class="po-reset" id="resetBtn" title="Reset the filters">&#8635; Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div id="stPTitle"></div>
    <div class="sp-kpis" id="stKpi" style="display:none"></div>

    <div class="panel" id="printTablePanel" style="margin-bottom:16px">
        <div class="table-header-row">
            <div><h3><span class="dot"></span> Suppliers - opening, movement and balance</h3></div>
            <div class="table-tools">
                <span class="mv-loading" id="tableNote">Loading...</span>
            </div>
        </div>
        <div class="table-scroll">
            <table id="stTable"></table>
        </div>
    </div>
    <div class="panel po-lv" id="stmtPanel" style="display:none"></div>
    <div class="panel po-lv" id="payPanel" style="display:none"></div>
    <div class="panel po-lv" id="invPanel" style="display:none"></div>
    <div class="panel po-lv" id="glPanel" style="display:none"></div>
</div>
<style>
#stPTitle{display:none;}
@media print{
@page{size:A4 landscape;margin:12mm;
@top-right{content:"Co. Dashboard";font:8px sans-serif;color:#999;}
@bottom-right{content:"Page " counter(page) " of " counter(pages);font:8px sans-serif;color:#555;}}
body.st-print .t-Header,body.st-print .t-Body-nav,body.st-print .t-Body-title,body.st-print .t-Footer,body.st-print #apexDevToolbar,body.st-print .a-DevToolbar,body.st-print .jm-hdr,body.st-print .jm-sb,
body.st-print .dash-header,body.st-print .sp-bar,body.st-print .lv-btns,body.st-print .table-tools,body.st-print .pasof,body.st-print .st-kf,body.st-print #printTablePanel .table-header-row{display:none !important;}
html,body.st-print,body.st-print #t_PageBody,body.st-print .t-Body,body.st-print .t-Body-main,body.st-print .t-Body-content,body.st-print .t-Body-contentInner,
body.st-print .container,body.st-print .row,body.st-print .col,body.st-print .t-Region,body.st-print .t-Region-body,body.st-print form#wwvFlowForm,body.st-print .wrap
{background:#fff !important;padding-top:0 !important;margin-top:0 !important;height:auto !important;min-height:0 !important;overflow:visible !important;}
body.st-print .wrap{padding:0 !important;width:100% !important;}
body.st-print .panel{border:none !important;box-shadow:none !important;padding:0 !important;margin:0 !important;background:#fff !important;}
body.st-print:not(.st-lvl1):not(.st-lvl2):not(.st-lvl3):not(.st-lvl4) #stPTitle{display:block;margin:0 0 8px;padding:0 0 6px;border-bottom:1px solid #c6c9d0;}
#stPTitle .pt-h{font-family:var(--font-head);font-size:14px;font-weight:600;color:#000;}
#stPTitle .pt-h b{color:var(--navy);font-weight:700;}
#stPTitle .pt-s{font-size:9.5px;color:#333;margin-top:3px;}
body.st-print .sp-ptitle{display:block;font-size:9.5px;color:#333;margin:0 0 6px;}
body.st-print .crumb{font-size:13px;font-weight:600;color:#000;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #c6c9d0;flex:1 1 auto;}
body.st-print .crumb .c1,body.st-print .crumb .c2{max-width:none;}body.st-print .crumb .c2{color:var(--navy);}
body.st-print .sp-kpis{margin-bottom:8px;}
body.st-print .kpi-row{grid-template-columns:repeat(4,1fr) !important;gap:6px;margin-bottom:6px;}body.st-print .kpi-row.k3{display:none !important;}
body.st-print .kpi{padding:5px 10px 5px 14px;border-radius:6px;border-color:#ccd;break-inside:avoid;}body.st-print .kpi::before{top:5px;bottom:5px;width:4px;}
body.st-print .kpi .label{font-size:7.5px;margin-bottom:2px;color:#555;}body.st-print .kpi .value{font-size:13px;}body.st-print .k3 .kpi .value{font-size:11px;}body.st-print .kpi .sub{font-size:8px;margin-top:2px;}
body.st-print .sbx{grid-template-columns:2fr 1fr 1fr 1fr 1fr !important;margin-bottom:6px;border-radius:6px;}
body.st-print .sb{padding:4px 10px;}body.st-print .sb small{font-size:8px;}body.st-print .sb strong{font-size:11.5px;}
body.st-print .alert,body.st-print .pdesc{padding:4px 8px;font-size:9px;margin-bottom:5px;border-radius:6px;}
body.st-print .oh-h4{margin:8px 0 4px;font-size:9.5px;}
body.st-print .two{grid-template-columns:1.5fr 1fr !important;gap:10px;}
body.st-print .table-scroll{overflow:visible !important;}
body.st-print table{font-size:10px !important;width:100% !important;min-width:0 !important;border:1px solid #c6c9d0 !important;border-collapse:collapse !important;}
body.st-print thead{display:table-header-group !important;}
body.st-print thead th{position:static !important;background:var(--box-bg) !important;color:var(--navy) !important;border:1px solid #c6c9d0 !important;font-size:8.5px !important;padding:5px 7px !important;}
body.st-print tbody td{border:1px solid #c9cdde !important;padding:3px 7px !important;line-height:1.25 !important;font-size:10px !important;background:#fff;}
body.st-print tbody tr:nth-child(even) td{background:#f7f8fc !important;}
body.st-print tbody td.c-code{font-size:9px !important;}
body.st-print tfoot{display:table-row-group;}
body.st-print tfoot td{padding:4px 7px !important;font-size:10px !important;background:var(--box-bg) !important;border:1px solid #c6c9d0 !important;}
body.st-print #stTable tfoot td,body.st-print .po-lv tfoot tr.tot:first-child td{border-top:2px solid var(--pink) !important;}
body.st-print tfoot tr{break-before:avoid-page;page-break-before:avoid;}
body.st-print tr{break-inside:avoid;page-break-inside:avoid;}
body.st-print td.sname{min-width:0;color:#000 !important;}
body.st-print .po-lv td.lnk{color:#000 !important;text-decoration:none;}
body.st-print .po-lv tbody td.ds{min-width:0;max-width:none;white-space:normal !important;}
body.st-print .tag,body.st-print .ty{font-size:7.5px;padding:0 4px;}
body.st-print thead th,body.st-print tbody td,body.st-print tfoot td,body.st-print .tag,body.st-print .ty,body.st-print .sb,body.st-print .kpi,body.st-print .kpi::before,body.st-print .alert,body.st-print .pdesc
{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>

</div></div></div>
<footer class="t-Footer"><div class="t-Footer-top"><a href="#top" class="t-Footer-topButton" title="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><polyline points="18 15 12 9 6 15"></polyline></svg></a></div></footer>
<script src="js/p0_sidebar.compact.js"></script>
<script src="js/p0_sales.doc.compact.js"></script>
<script src="js/p0_gl.entry.compact.js"></script>
<script src="js/supst_supst.compact.js"></script>
</body></html>
